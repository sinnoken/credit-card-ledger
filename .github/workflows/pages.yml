# Build the SPA and publish web/dist/site to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch third-party files (pdf.js, onnxruntime-web, ExcelJS, OCR model)
        run: |
          pip install --quiet onnxruntime
          bash scripts/fetch_vendor.sh

      - name: Build
        run: python3 build.py

      # Synthetic tests only: real statements are never in the repo, so fixture tests SKIP here.
      - name: Test
        run: |
          node test/banks.test.cjs
          node test/banks_edge.test.cjs
          node test/logic.test.cjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
